# pkm-sidecar — example configuration
#
# Copy to ~/.config/pkm-sidecar/config.toml (or point PKM_SIDECAR_CONFIG_PATH at
# it) and uncomment only what you want to change. Every key below is commented
# out and shows its built-in default, so an empty file is a valid config.
#
#   install -m 600 config.example.toml ~/.config/pkm-sidecar/config.toml
#
# Keep the file chmod 600 if it holds a token — `pkm-sidecar doctor` checks this
# and fails if the file is group- or other-readable.
#
# Precedence: CLI flags > environment variables > this file > defaults.

# ---------------------------------------------------------------------------
# Minimal config for the common case: Joplin on loopback, token from the
# environment, everything else default. That needs no file at all — just
# JOPLIN_TOKEN. The sections below are for when you want more than that.
# ---------------------------------------------------------------------------

[server]
# Bind address for the API and dashboard. A non-loopback host is refused unless
# you pass --allow-non-localhost *and* set an explicit api_token.
# host = "127.0.0.1"
# port = 8765
# Bearer token for /api/*. Leave unset on loopback and the sidecar mints an
# ephemeral one at startup, writes it 0600 to a runtime file, and logs only the
# path. A non-loopback bind requires you to set this explicitly.
# api_token = "change-me"
# allow_non_localhost = false

[joplin]
# Joplin's Web Clipper service. Enable it in Joplin: Tools > Options > Web Clipper.
# base_url = "http://127.0.0.1:41184"
# The clipper token. Prefer the JOPLIN_TOKEN environment variable so it stays
# out of a file on disk; required for any indexing operation.
# token = "..."
# How often `serve` polls Joplin's /events cursor for incremental changes.
# event_poll_seconds = 10
# page_limit = 100

[database]
# The SQLite index. Derived and disposable: delete it and rebuild.
# path = "~/.local/share/pkm-sidecar/index.sqlite3"

[logging]
# One of DEBUG, INFO, WARNING, ERROR, CRITICAL.
# level = "INFO"

[indexing]
# A note untouched for this long counts as stale in the dashboard.
# stale_days = 90
# Folder names treated as an inbox, in priority order.
# inbox_folder_names = ["Inbox", "00 Inbox", "_Inbox"]
# On `serve` startup, if the index has never been fully built and a token is
# configured, run a one-time full rebuild. Without this the launcher-managed
# (serve-only) path would stay empty, since incremental sync only sees changes
# from now on. Set false to opt out.
# rebuild_on_empty_start = true

[enrichment]
# Suggested titles and tags, generated by a local Ollama host.
#
# OFF BY DEFAULT, and deliberately so: enabling it sends note bodies to
# ollama_base_url. Nothing is ever written back to Joplin — suggestions land in
# a separate database for you to accept or reject.
# enabled = false

# Where Ollama listens. Loopback needs no further thought; anything else sends
# your note bodies across the network in cleartext to an unauthenticated API, so
# prefer an encrypted overlay (Tailscale/WireGuard) or an SSH tunnel. `doctor`
# warns when this is not loopback.
# ollama_base_url = "http://127.0.0.1:11434"

# Models must already be pulled on that host; `doctor` verifies each one.
# title_model = "llama3.1:8b"
# tag_model = "llama3.1:8b"
# embedding_model = "bge-large:335m-en-v1.5-fp16"

# Avoid reasoning models here. Measured: gpt-oss:20b spends its token budget on
# the thinking channel and returns an empty title, and `think: false` does not
# suppress it.

# At most this many tags proposed per note.
# max_tags_per_note = 3
# Neighbours consulted when scoring tags by embedding similarity.
# neighbours = 25

# Suggestion store. Defaults to suggestions.sqlite3 beside the index. Kept
# separate from the index on purpose: the index is disposable, but your accept
# and reject decisions are not, and must survive a rebuild.
# db_path = "~/.local/share/pkm-sidecar/suggestions.sqlite3"
