name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here needs to write back to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Fails if pyproject.toml and uv.lock have drifted apart, so a dependency
      # bump can't land without the lockfile that goes with it.
      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # --no-sync: reuse the env synced above. A bare `uv run` re-syncs to the
      # default (no dev extra) and would strip ruff/pytest back out.
      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Pytest
        run: >-
          uv run --no-sync pytest -m 'not manual'
          --cov=pkm_sidecar --cov-report=term-missing --cov-fail-under=70

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Mypy
        run: uv run --no-sync mypy src

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      # The wheel has to carry schema.sql, templates/ and static/ or the
      # installed CLI breaks at runtime; catch a packaging regression here.
      - name: Build sdist and wheel
        run: uv build

      - name: Verify packaged data files are present
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          echo "Inspecting $wheel"
          contents=$(uv run --no-project python -c "
          import sys, zipfile
          print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))
          " "$wheel")
          echo "$contents"
          for f in pkm_sidecar/schema.sql pkm_sidecar/templates/base.html \
                   pkm_sidecar/templates/index.html \
                   pkm_sidecar/static/dashboard.css \
                   pkm_sidecar/static/dashboard.js; do
            echo "$contents" | grep -qx "$f" || { echo "missing from wheel: $f"; exit 1; }
          done
