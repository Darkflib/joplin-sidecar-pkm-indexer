name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here needs to write back to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here runs authenticated git commands.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Fails if pyproject.toml and uv.lock have drifted apart, so a dependency
      # bump can't land without the lockfile that goes with it.
      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # --no-sync: reuse the env synced above. A bare `uv run` re-syncs to the
      # default (no dev extra) and would strip ruff/pytest back out.
      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Pytest
        run: >-
          uv run --no-sync pytest -m 'not manual'
          --cov=pkm_sidecar --cov-report=term-missing --cov-fail-under=70

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here runs authenticated git commands.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      # Pin the interpreter rather than letting uv fall back to the runner's
      # system Python, so the blocking check runs on a version we test against.
      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --extra dev --python 3.13

      - name: Mypy
        run: uv run --no-sync --python 3.13 mypy src

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here runs authenticated git commands.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      # Both artefacts have to carry schema.sql, templates/ and static/ or the
      # installed CLI breaks at runtime; catch a packaging regression here.
      - name: Build sdist and wheel
        run: uv build

      - name: Verify packaged data files are present
        run: |
          uv run --no-project python - <<'PY'
          import pathlib
          import sys
          import tarfile
          import zipfile

          # Read at runtime by db.py (schema.sql) and dashboard.py (templates,
          # static), so absence is an install-time break, not a test failure.
          REQUIRED = [
              "schema.sql",
              "templates/base.html",
              "templates/index.html",
              "static/dashboard.css",
              "static/dashboard.js",
          ]

          def one(pattern: str) -> pathlib.Path:
              found = sorted(pathlib.Path("dist").glob(pattern))
              if len(found) != 1:
                  sys.exit(f"expected exactly one dist/{pattern}, found {len(found)}")
              return found[0]

          wheel = one("*.whl")
          sdist = one("*.tar.gz")

          with zipfile.ZipFile(wheel) as zf:
              wheel_names = set(zf.namelist())
          with tarfile.open(sdist) as tf:
              # Drop the "<name>-<version>/" root every sdist member carries.
              sdist_names = {n.split("/", 1)[-1] for n in tf.getnames()}

          # Set membership, so a "." in a path can never act as a wildcard.
          missing = [
              f"{wheel.name}: pkm_sidecar/{rel}"
              for rel in REQUIRED
              if f"pkm_sidecar/{rel}" not in wheel_names
          ]
          missing += [
              f"{sdist.name}: src/pkm_sidecar/{rel}"
              for rel in REQUIRED
              if f"src/pkm_sidecar/{rel}" not in sdist_names
          ]

          for entry in missing:
              print(f"missing: {entry}")
          print(f"checked {len(REQUIRED)} data files in {wheel.name} and {sdist.name}")
          sys.exit(1 if missing else 0)
          PY
