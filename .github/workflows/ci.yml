name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # --no-sync: reuse the env synced above. A bare `uv run` re-syncs to the
      # default (no dev extra) and would strip ruff/pytest back out.
      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Pytest
        run: >-
          uv run --no-sync pytest -m 'not manual'
          --cov=pkm_sidecar --cov-report=term-missing --cov-fail-under=70

  typecheck:
    runs-on: ubuntu-latest
    # Mypy is opt-in per PRD §6: report failures but don't block the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Mypy
        run: uv run --no-sync mypy src
