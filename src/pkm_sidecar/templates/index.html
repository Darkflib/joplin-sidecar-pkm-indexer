{% extends "base.html" %}
{% block content %}
<section id="paste-banner" hidden>
  <p>Enter the sidecar API token to load data:</p>
  <input id="token-input" type="password" autocomplete="off" />
  <button id="token-save" type="button">Save</button>
</section>

<div class="columns" id="columns">
  <section class="column" id="col-search" hidden data-key="search">
    <header>
      <h2>Search <span class="col-count" id="count-search">0</span></h2>
      <button type="button" class="col-clear" id="search-clear" title="Clear search">×</button>
    </header>
    <ul id="search-results"></ul>
  </section>
  <section class="column" data-key="recent">
    <header><h2>Recent <span class="col-count" id="count-recent">–</span></h2></header>
    <ul id="recent"></ul>
  </section>
  <section class="column" data-key="inbox">
    <header><h2>Inbox <span class="col-count" id="count-inbox">–</span></h2></header>
    <ul id="inbox"></ul>
  </section>
  <section class="column" data-key="untagged">
    <header><h2>Untagged <span class="col-count" id="count-untagged">–</span></h2></header>
    <ul id="untagged"></ul>
  </section>
  <section class="column" data-key="todos">
    <header><h2>TODOs <span class="col-count" id="count-todos">–</span></h2></header>
    <ul id="todos"></ul>
  </section>
  <section class="column" data-key="review">
    <header><h2>Needs review <span class="col-count" id="count-review">–</span></h2></header>
    <ul id="review"></ul>
  </section>
  <section class="column" data-key="stale">
    <header><h2>Stale <span class="col-count" id="count-stale">–</span></h2></header>
    <ul id="stale"></ul>
  </section>
</div>
{% endblock %}
