[project]
name = "pkm-sidecar"
version = "0.2.2"
description = "Local-first read-only Joplin PKM sidecar: indexes notes into SQLite and serves a local dashboard/API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mike Preston", email = "darkflib@gmail.com" }]
keywords = ["joplin", "pkm", "sidecar", "indexer", "sqlite", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
# Floors bound what a lock-less install may resolve to, and track the versions
# CI exercises; uv.lock pins the exact set that CI and `uv sync` actually use.
# The dev extra below is opt-in — a plain `pip install .` does not pull it in.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "typer>=0.27",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-httpx>=0.36",
    "pytest-cov>=7.1",
    "ruff>=0.16.2",
    "mypy>=2.3",
    "pre-commit>=4.6",
]

[project.scripts]
pkm-sidecar = "pkm_sidecar.cli:app"

[project.urls]
Homepage = "https://github.com/darkflib/joplin-sidecar-pkm-indexer"
Repository = "https://github.com/darkflib/joplin-sidecar-pkm-indexer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Non-.py files under the package dir (schema.sql, templates/, static/) are
# packaged automatically by hatchling.
packages = ["src/pkm_sidecar"]

[tool.uv]
# Keep the dev tooling in the synced environment by default.
default-groups = []

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
# Opinionated-but-boring: errors, pyflakes, isort, bugbear, comprehensions,
# pyupgrade, simplify, and a few correctness-focused rules.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: real FastAPI app + mocked Joplin + tmp sqlite",
    "manual: requires a running Joplin; skipped in CI (see tests/manual/CHECKLIST.md)",
]

[tool.coverage.run]
source = ["pkm_sidecar"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abc.abstractmethod"]

[tool.mypy]
python_version = "3.12"
packages = ["pkm_sidecar"]
mypy_path = "src"
strict = true
# v0.1 posture: strict where it helps, tolerant where third-party stubs lag.
warn_unused_ignores = true
ignore_missing_imports = true
