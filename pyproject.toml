[project]
name = "pkm-sidecar"
version = "0.1.0"
description = "Local-first read-only Joplin PKM sidecar: indexes notes into SQLite and serves a local dashboard/API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mike Preston", email = "darkflib@gmail.com" }]
keywords = ["joplin", "pkm", "sidecar", "indexer", "sqlite", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
pkm-sidecar = "pkm_sidecar.cli:app"

[project.urls]
Homepage = "https://github.com/darkflib/joplin-sidecar-pkm-indexer"
Repository = "https://github.com/darkflib/joplin-sidecar-pkm-indexer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Non-.py files under the package dir (schema.sql, templates/, static/) are
# packaged automatically by hatchling.
packages = ["src/pkm_sidecar"]

[tool.uv]
# Keep the dev tooling in the synced environment by default.
default-groups = []

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
# Opinionated-but-boring: errors, pyflakes, isort, bugbear, comprehensions,
# pyupgrade, simplify, and a few correctness-focused rules.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
packages = ["pkm_sidecar"]
mypy_path = "src"
strict = true
# v0.1 posture: strict where it helps, tolerant where third-party stubs lag.
warn_unused_ignores = true
ignore_missing_imports = true
