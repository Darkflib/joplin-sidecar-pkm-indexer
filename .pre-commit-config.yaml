# Light pre-commit hooks. Mypy is deliberately excluded to keep commits fast;
# run `uv run mypy src` locally / in CI on demand.
repos:
  # Keep `rev` in step with the `ruff` pin in pyproject's dev extra, otherwise
  # local hooks and CI disagree about what "formatted" means.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
